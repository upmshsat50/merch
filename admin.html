<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8d153a">
  <title>Admin Login | UPM SHS at 50 Merch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=League+Spartan:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=20260810-8">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <a href="index.html" class="brand login-brand" aria-label="Back to merch store">
        <img class="brand-logo" src="assets/upm-shs-at-50-logo.jpg" alt="UPM SHS at 50">
        <span>
          <strong>UPM SHS at 50</strong>
          <small>Merch Admin</small>
        </span>
      </a>

      <div class="login-copy">
        <p class="eyebrow">AUTHORIZED ACCESS</p>
        <h1>Sign in to the merch dashboard</h1>
        <p class="muted">Use your authorized admin email and password.</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <label>
          Email
          <input required type="email" id="email" autocomplete="username" placeholder="name@up.edu.ph">
        </label>

        <label>
          Password
          <div class="password-field">
            <input required type="password" id="password" autocomplete="current-password">
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">Show</button>
          </div>
        </label>

        <button class="primary-btn login-submit" id="loginButton" type="submit">Sign in</button>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>

      <a class="back-store" href="index.html">← Back to merch store</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260810-8"></script>
  <script src="admin-login.js?v=20260810-8"></script>
</body>
</html>
